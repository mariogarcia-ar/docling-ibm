[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voucherflow"
version = "0.1.0"
description = "Librería robusta de procesamiento documental (clasificación, extracción y conclusión de comprobantes)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Equipo voucherflow — ibm-docling" }]
keywords = ["documentos", "comprobantes", "docling", "ollama", "pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# Dependencias de F0/F1. Docling/pymupdf/requests se declaran como obligatorias
# del paquete; en el entorno de desarrollo se resuelven contra py313_env.
# pymupdf se agregó en F1/T-101: distingue pdf_texto/pdf_escaneado por contenido
# real de página (la heurística de bytes daba falsos positivos en PDFs Type0).
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "docling>=2.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# Extra para desarrollo / QA (tests, lint, cobertura).
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "respx>=0.21",
    "typer>=0.12",
    "mypy>=1.10",
]
# Extra histórico del CLI. El cliente de F6/T-601 usa ``argparse`` de la stdlib
# (regla dura: no se agregan dependencias), así que este extra queda vacío y se
# conserva solo para no romper instalaciones que lo pedían.
cli = []

[project.scripts]
# Entry point del cliente CLI de F6/T-601 (doc 03 §8.1, ADR-007).
voucherflow = "voucherflow.cli.main:entrypoint"
# Entry point de la API HTTP de F6/T-606 (fase 2, no bloqueante). Es un binario
# SEPARADO del CLI a propósito: el diagrama C4 (doc 03 §3) los muestra como dos
# contenedores del nivel Cliente, y el contrato de once subcomandos de E-CLI-1
# está verificado por T-604/T-605 (no se reabre por una tarea de fase 2).
voucherflow-http = "voucherflow.http.__main__:main"
# Laboratorio de LLM externos: extrae comprobantes con un proveedor externo
# y evalúa el prompt contra los datos cargados. Reemplaza a los dos scripts
# gemelos (uno por proveedor) por un comando donde el proveedor es argumento.
voucherflow-lab = "voucherflow.llm.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/example/voucherflow"  # placeholder: lo define el dueño del repo (ADR-007)

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Piso de versiones de sintaxis. De acá sale `UP017` (`datetime.UTC` en vez de
# `datetime.timezone.utc`), que es la única regla que depende del proyecto.
target-version = "py311"
# El repo ya escribe a ~88 (percentil 99 del código real: 89 chars), así que
# esto documenta lo que se practica en vez de imponer un cambio de estilo.
line-length = 88

[tool.ruff.lint]
# Selección deliberada y CHICA, no el default de la versión instalada.
#
# Ruff cambió su default con el tiempo (en 0.16 son ~250 reglas: RUF/UP/S/PL/
# TRY/DTZ/…), y eso no da un criterio estable para el repo. El conjunto de abajo
# es el que el proyecto puede sostener: errores reales, no preferencias.
#
#   E4, E7, E9  errores de pycodestyle (imports, sentencias, sintaxis)
#   F           pyflakes: imports y variables sin usar, nombres indefinidos
#   I           orden de imports (isort)
#   UP035       imports deprecados (`typing.Sequence` → `collections.abc`)
#
# Lo que NO se activa, a propósito:
#
#   RUF022  Ordenar `__all__`: en `models/` y `validation/` los nombres están
#           agrupados POR MÓDULO con comentarios que explican cada bloque. El
#           orden es información; alfabetizarlo la destruiría.
#   UP037   Quitar comillas de anotaciones: con `from __future__ import
#           annotations` son redundantes, pero **no** son la causa de los F821
#           (probado: aplicarla y los F821 siguen igual). Es cosmético.
#   BLE001  `except Exception` ciego: es la política del pipeline (un archivo
#           ilegible no puede cortar el lote) y hay ~17 con su comentario.
#   S110    `try/except/pass`: igual, con el motivo escrito al lado.
#   PLW1510 `subprocess.run` sin `check`: se lee `returncode` a mano a
#           propósito (ffmpeg/ffprobe devuelven diagnóstico, no solo un código).
select = ["E4", "E7", "E9", "F", "I", "UP035"]

ignore = [
    # ⚠️ F821 acá es un FALSO POSITIVO, no una regla relajada. Las anotaciones
    # como `-> "ProcessedDocument"` (string, en un módulo que no importa el
    # nombre) no las resuelve ni Ruff ni el intérprete. Verificado con
    # `typing.get_type_hints()`: lanza NameError. O sea que el chequeo no pierde
    # nada que hoy funcione — el nombre ya era irresoluble.
    #
    # Deuda anotada: son ~18 casos y lo correcto es un bloque
    # `if TYPE_CHECKING:` con los imports. Cuando se haga, esta línea se saca.
    "F821",
]

[tool.ruff.lint.per-file-ignores]
# (Vacío a propósito: todavía no hizo falta ninguna excepción por archivo. Si
# aparece una, va acá CON el motivo escrito, no con un `noqa` suelto.)

[tool.pytest.ini_options]
# La raíz de tests vive en tests/. Los tests de HTTP usan unittest.mock;
# respx/httpx quedan como extras opcionales (no requeridos para la suite).
testpaths = ["tests"]
# Layout src/: permite importar ``voucherflow`` sin instalación previa.
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: marca tests que requieren servicios reales (Docling/Ollama) y no corren en CI.",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["voucherflow"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
