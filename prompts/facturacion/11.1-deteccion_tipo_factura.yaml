# Detección del tipo de comprobante argentino.
# system: reglas de negocio.
# system_llm: lectura de OCR/Markdown.
# system_vlm: lectura visual de imágenes.

system: |
  Aplicá estas reglas de negocio al comprobante:

  - Clasificá el documento como "Factura", "Nota de Crédito" o "Nota de Débito".
  - Usá "Nota de Crédito" para NOTA DE CREDITO, N. CREDITO o NC.
  - Usá "Nota de Débito" para NOTA DE DEBITO, N. DEBITO o ND.
  - En otro caso, usá "Factura".
  - Una Nota de Crédito sin comprobante asociado genera alerta.

  Determiná la letra esperada solo con condiciones fiscales comprobadas:
  - Responsable Inscripto + Responsable Inscripto: A.
  - Responsable Inscripto + Monotributo, Exento o Consumidor Final: B.
  - Emisor Monotributo o Exento: C.
  - Exportación comprobada con receptor fuera de Argentina: E.
  - Conservá M si aparece claramente.

  Validá conflictos:
  - A es débil si faltan dos CUIT o IVA discriminado.
  - B es incompatible con IVA discriminado.
  - C es incompatible con emisor Responsable Inscripto.
  - Moneda extranjera sola no confirma E.
  - Si la letra detectada contradice la esperada, generá alerta.
  - En conflicto, conservá la letra detectada, usá confianza baja y explicá el
    conflicto.
  - No inventes datos. Usá null para datos ausentes.

  Devolvé únicamente este JSON válido:
  {
    "tipo_documento": "Factura",
    "tipo_comprobante": "A",
    "confianza": "alta",
    "candidatos_descartados": [],
    "candidatos_restantes": [],
    "tipo_esperado_por_negocio": null,
    "tipo_detectado_por_documento": null,
    "tipo_detectado_por_documento_explicacion": null,
    "reglas_aplicadas": [],
    "coincide_negocio_vs_documento": false,
    "alerta": {"disparada": false, "regla": null, "mensaje": null},
    "campos_desconocidos": []
  }
  Usá valores concretos, [] para listas vacías y null para datos desconocidos.

system_llm: |
  Aplicá las reglas de negocio definidas en system.
  Analizá únicamente el texto OCR/Markdown recibido.

  - Buscá A, B, C, M o E junto a FACTURA, COMPROBANTE, Nota de Crédito o Nota
    de Débito.
  - Priorizá expresiones OCR como FACTURA A, FACTURA B, FACTURA C, FACTURA M y
    FACTURA E.
  - Guardá la letra encontrada en tipo_detectado_por_documento.
  - Explicá en tipo_detectado_por_documento_explicacion el texto OCR que prueba
    la letra. Si no existe evidencia, usá null.
  - Usá únicamente datos presentes en el texto.

  Devolvé únicamente JSON válido, sin markdown ni explicaciones externas.
  Elegí valores concretos y no copies placeholders.

system_vlm: |
  Aplicá las reglas de negocio definidas en system.
  Analizá únicamente la imagen adjunta.

  - Localizá el recuadro cercano al encabezado.
  - Leé la letra grande dentro del recuadro: A, B, C, M o E.
  - Priorizá la letra del recuadro sobre OCR o inferencias.
  - Si el recuadro muestra A y "COD. 01", detectá A. El código no reemplaza la
    letra.
  - Guardá la letra visible en tipo_detectado_por_documento.
  - Explicá en tipo_detectado_por_documento_explicacion qué letra viste, dónde
    la viste y qué código acompañaba al recuadro.
  - Usá únicamente datos visibles en la imagen.

  Devolvé únicamente JSON válido, sin markdown ni explicaciones externas.
  Elegí valores concretos y no copies placeholders.

user: |
  Analizá este comprobante OCR/Markdown aplicando las reglas de system.
  Devolvé únicamente el JSON solicitado.

  --- COMPROBANTE ---
  {{documento}}
  --- FIN DEL COMPROBANTE ---

user_vlm: |
  Analizá la imagen adjunta aplicando las reglas de system.
  Devolvé únicamente el JSON solicitado. Prestá atención al recuadro con la
  letra grande y su código.

  Esquema JSON obligatorio:
  {
    "tipo_documento": "Factura",
    "tipo_comprobante": "A",
    "confianza": "alta",
    "candidatos_descartados": [],
    "candidatos_restantes": [],
    "tipo_esperado_por_negocio": null,
    "tipo_detectado_por_documento": null,
    "tipo_detectado_por_documento_explicacion": null,
    "reglas_aplicadas": [],
    "coincide_negocio_vs_documento": false,
    "alerta": {"disparada": false, "regla": null, "mensaje": null},
    "campos_desconocidos": []
  }
