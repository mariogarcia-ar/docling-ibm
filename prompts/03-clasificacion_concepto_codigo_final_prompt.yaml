  Devolvé siempre:
  {
    "macro_categoria": "MCNN (la usada para elegir el concepto; puede diferir de la recibida si se aplicó el fallback global)",
    "concepto": "CTNNN",
    "nombre_concepto": "nombre tal como aparece en la tabla",
    "cuenta_contable": "NNNN,NN",
    "condicion_impositiva": "el valor recibido en el input",
    "codigo_final": "el código de la celda correspondiente, o el primero de la lista si hay varios candidatos",
    "candidatos_codigo_final": ["lista de todos los códigos de la celda si hay más de uno; array vacío si hay uno solo"],
    "requiere_revision_humana": true/false,
    "confianza": "alta | media | baja",
    "criterio_inferido": true,
    "justificacion": "una oración breve citando qué parte del proveedor o la descripción determinó el concepto"
  }

  Reglas de clasificación:
  - Evaluá ÚNICAMENTE los conceptos que pertenecen a "macro_categoria"
    (columna Macro de la primera tabla). No mires conceptos de otras
    macros salvo que se active el fallback global de abajo.
  - Elegí el concepto cuyo nombre coincide mejor con "descripcion" y/o
    "proveedor". Usá el sentido común del nombre del concepto (ej.
    "Materiales, insumos y herramientas" para ferretería/insumos de
    trabajo; "Gastos vehículos" para combustible/lavado/estacionamiento de
    vehículo propio; "Honorarios" para facturas de profesionales
    independientes).
  - Si "macro_categoria" es "MC15" (Agricultura), elegí entre "CT036"
    (semillas) y "CT037" (agroquímicos) según la descripción; si ninguna
    de las dos aplica, tratalo igual que "ningún concepto aplica" (regla
    siguiente).
  - Si ningún concepto de la macro recibida aplica con claridad:
    - si el gasto es un servicio, usá "CT026" (Gastos por servicios
      varios, MC11) como fallback GLOBAL, sin importar la macro original;
    - si el gasto NO es un servicio, usá "CT035" (Gastos varios, MC14)
      como fallback GLOBAL.
    En ambos casos, informá en "macro_categoria" la macro del fallback
    (MC11 o MC14, no la recibida), poné "confianza": "baja" y explicá en
    "justificacion" que se usó el fallback.
  - Buscá "codigo_final" en la tabla de código final usando "concepto" y
    "condicion_impositiva". Si la celda tiene un solo código, usalo tal
    cual y dejá "candidatos_codigo_final" vacío. Si la celda tiene más de
    un código (separados por "/"), poné el primero en "codigo_final",
    todos en "candidatos_codigo_final", y "requiere_revision_humana": true
    — no hay información en la fuente para elegir entre ellos.
  - Si la celda para ese concepto y esa condición impositiva es "—" (no
    existe código), no inventes uno: dejá "codigo_final": null,
    "requiere_revision_humana": true, y explicá en "justificacion" que esa
    combinación concepto/alícuota no tiene código definido.
  - No agregues campos fuera de los listados arriba.

  Devolvé JSON válido: sin comentarios, sin comas finales, sin claves
  duplicadas.

user: |
  Determiná el concepto y el código final del siguiente gasto.

  macro_categoria: {{macro_categoria}}
  proveedor: {{proveedor}}
  descripcion: {{descripcion}}
  monto: {{monto}}
  condicion_impositiva: {{condicion_impositiva}}
