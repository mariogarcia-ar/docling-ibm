system_prompt: |
  Sos un agente de clasificación fiscal especializado en comprobantes argentinos (AFIP/ARCA).
  Tu única tarea es determinar el TIPO DE DOCUMENTO (Factura / Nota de Crédito / Nota de Débito)
  y, dentro de ese tipo, la LETRA DE COMPROBANTE (A, B, C, M o E), cruzando cuatro fuentes
  de evidencia: (1) reglas de descarte rápido (fast-fail) que eliminan candidatos imposibles
  antes de analizar todo el documento, (2) la condición fiscal de emisor y receptor,
  (3) lo que el OCR/visión detectó en el documento físico, y (4) reglas de conflicto
  que detectan inconsistencias entre las anteriores.

  Estrategia: aplicá SIEMPRE las reglas de descarte primero. Son más baratas de evaluar
  que la cascada completa y reducen el espacio de candidatos antes de razonar sobre negocio/OCR.
  Si las reglas de descarte dejan un único candidato, listalo igual en el resultado (no es un
  atajo para saltear la validación cruzada, es un filtro de eficiencia).

  No inventes datos. Si un campo no está disponible, marcalo como "desconocido" y
  bajá el nivel de confianza en vez de asumir un valor.

inputs_esperados:
  emisor:
    cuit: string
    condicion_fiscal: enum [Responsable Inscripto, Monotributo, Exento, Consumidor Final, desconocido]
    pais: string
  receptor:
    cuit: string
    condicion_fiscal: enum [Responsable Inscripto, Monotributo, Exento, Consumidor Final, desconocido]
    pais: string
  ocr:
    letra_detectada_cabecera: enum [A, B, C, M, E, null]
    texto_encabezado: string          # texto crudo cercano al punto de venta, para regex
    desglose_iva_discriminado: boolean | null   # true si Neto + IVA aparecen separados
    campos_totales: enum [discriminado, subtotal_unico, desconocido]
    conteo_cuits_detectados: integer            # cantidad de matches de \b\d{2}-\d{8}-\d{1}\b en el texto
    menciona_iva_o_alicuota: boolean | null     # true si aparece "IVA 21%", "IVA 10.5%", "Crédito Fiscal", etc.
    receptor_texto_condicion: enum [Consumidor Final, Exento, Monotributo, no_detectado]  # texto literal leído en el bloque de cliente
    receptor_pais_texto: enum [Argentina, extranjero, no_detectado]  # inferido de provincia/CP/país en el bloque de cliente
    moneda: enum [ARS, USD, EUR, otra, desconocida]
    tipo_cambio_declarado: boolean | null       # true si el comprobante declara cotización de moneda extranjera
    encabezado_tipo_documento: string           # texto crudo del rótulo principal, para detectar NC/ND
    comprobante_asociado_detectado: boolean | null  # true si aparece "Comprobante Asociado:" o "Factura Ref:"
  padron_arca:
    emisor_condicion: enum [Responsable Inscripto, Monotributo, Exento, desconocido]  # resultado real de consulta al padrón, puede diferir de emisor.condicion_fiscal si ese vino solo del OCR

reglas:
  descarte_tipo_documento:
    # Se evalúa ANTES que todo lo demás: decide si es Factura, NC o ND.
    - id: D0
      criterio: "encabezado_tipo_documento contiene NOTA DE CREDITO | N. CREDITO | NC | NOTA DE DEBITO | ND"
      accion: "descartar 'Factura' → tipo_documento = 'Nota de Crédito' o 'Nota de Débito' según el string; ir a validación NC/ND"
    - id: D0B
      criterio: "tipo_documento == 'Nota de Crédito' AND comprobante_asociado_detectado == false"
      accion: "descartar 'Nota de Crédito' como válida → marcar ALERTA_NC_SIN_REFERENCIA (toda NC legítima debe referenciar la factura que anula/modifica)"

  descarte_fast_fail:
    # Filtros baratos que eliminan letras candidatas antes de razonar sobre negocio/OCR.
    - id: DA1
      letra: "A"
      criterio: "ocr.conteo_cuits_detectados < 2"
      accion: "descartar A"
      nota: "Factura A exige CUIT de emisor y de receptor."
    - id: DA2
      letra: "A"
      criterio: "ocr.menciona_iva_o_alicuota == false"
      accion: "descartar A"
      nota: "Factura A discrimina el impuesto por ley (Neto + IVA por separado)."
    - id: DA3
      letra: "A"
      criterio: "ocr.receptor_texto_condicion in [Consumidor Final, Exento, Monotributo]"
      accion: "descartar A"
    - id: DB1
      letra: "B"
      criterio: "ocr.desglose_iva_discriminado == true"
      accion: "descartar B"
      nota: "Factura B lleva el IVA embebido en el precio final, no discriminado."
    - id: DB2
      letra: "B"
      criterio: "padron_arca.emisor_condicion in [Monotributo, Exento]"
      accion: "descartar B"
      nota: "Un monotributista/exento nunca emite Factura B."
    - id: DC1
      letra: "C"
      criterio: "ocr.menciona_iva_o_alicuota == true"
      accion: "descartar C"
      nota: "Monotributo/Exento no discrimina IVA."
    - id: DC2
      letra: "C"
      criterio: "padron_arca.emisor_condicion == 'Responsable Inscripto'"
      accion: "descartar C"
      nota: "Un RI tiene prohibido emitir comprobantes clase C."
    - id: DE1
      letra: "E"
      criterio: "ocr.receptor_pais_texto == 'Argentina'"
      accion: "descartar E"
    - id: DE2
      letra: "E"
      criterio: "ocr.moneda == 'ARS' AND ocr.tipo_cambio_declarado == false"
      accion: "descartar E"
      nota: "Regla predictiva de alta confianza, no absoluta: aplicarla solo para bajar prioridad de E, no para vetarla si ya hay evidencia fuerte de exportación (ej. receptor.pais != Argentina en R3)."

  negocio_tributario:
    - id: R1
      condicion: "emisor.condicion_fiscal in [Monotributo, Exento]"
      resultado: "C"
      prioridad: 1
      nota: "Aplica siempre, sin importar el receptor."
    - id: R2A
      condicion: "emisor.condicion_fiscal == 'Responsable Inscripto' AND receptor.condicion_fiscal == 'Responsable Inscripto'"
      resultado: "A"
      prioridad: 2
    - id: R2B
      condicion: "emisor.condicion_fiscal == 'Responsable Inscripto' AND receptor.condicion_fiscal in [Monotributo, Exento, Consumidor Final]"
      resultado: "B"
      prioridad: 2
    - id: R3
      condicion: "receptor.pais != 'Argentina'"
      resultado: "E"
      prioridad: 0   # máxima prioridad: pisa a R1/R2
      nota: "Exportación. Se evalúa ANTES que las reglas de condición fiscal."

  extraccion_ocr:
    - id: R4
      criterio: "Bounding box superior central/izquierda con un único carácter en [A,B,C,M,E]"
      accion: "usar ese carácter como ocr.letra_detectada_cabecera"
    - id: R5
      criterio: "regex sobre texto_encabezado"
      regex: "FACTURA\\s+([A-CME])|COMPROBANTE\\s+([A-CME])"
      accion: "usar el grupo capturado como ocr.letra_detectada_cabecera si R4 no dio resultado"
    - id: R6
      criterio: "si R4 y R5 fallan, inferir por campos_totales"
      logica:
        discriminado: "Tipo A (candidato, requiere confirmar con regla de negocio)"
        subtotal_unico: "Tipo B o C (desempatar con condicion_fiscal del emisor)"

  conflicto_auditoria:
    - id: R7
      condicion: "emisor.condicion_fiscal == 'Responsable Inscripto' AND receptor.cuit == cuit_scania_ri AND ocr.letra_detectada_cabecera == 'B'"
      accion: "ALERTA_ERROR_FINANCIERO"
      mensaje: >
        Comprobante inválido para cómputo de crédito fiscal. Requiere rechazo de
        rendición y solicitud de Nota de Crédito + Factura A correcta.

orden_de_evaluacion:
  0: "Evaluar D0/D0B (tipo de documento) → si es NC/ND, fijar tipo_documento y activar alerta si no hay comprobante_asociado_detectado; la letra (A/B/C) se sigue determinando con los mismos pasos de abajo, aplicados sobre la NC/ND."
  1: "Evaluar el bloque descarte_fast_fail completo → obtener candidatos_restantes (subconjunto de [A,B,C,M,E]). Si queda un solo candidato, ya es una señal fuerte pero NO reemplaza los pasos 2-4."
  2: "Evaluar R3 (exportación) — si aplica y E no fue descartada en el paso 1, resultado = E, fin. Si R3 aplica pero E fue descartada por fast-fail, tratar como conflicto (ver paso 6) en vez de forzar E ciegamente."
  3: "Evaluar R1 y R2 (negocio tributario), filtrando contra candidatos_restantes → tipo_esperado_por_negocio."
  4: "Evaluar R4 → R5 → R6 en cascada (extracción OCR), filtrando contra candidatos_restantes → tipo_detectado_por_documento."
  5: "Comparar tipo_esperado_por_negocio vs tipo_detectado_por_documento."
  6: "Si coinciden → resultado final = ese tipo, confianza alta."
  7: "Si no coinciden, o si alguno de los dos quedó fuera de candidatos_restantes (contradice una regla de descarte) → evaluar R7 y reglas de conflicto análogas → disparar alerta; resultado final = tipo_esperado_por_negocio (la ley manda sobre el papel) siempre que no haya sido descartado por fast-fail; si también fue descartado, confianza baja y reportar la contradicción explícitamente."

output_esperado:
  formato: json
  schema:
    tipo_documento: enum [Factura, Nota de Crédito, Nota de Débito]
    tipo_comprobante: enum [A, B, C, M, E]
    confianza: enum [alta, media, baja]
    candidatos_descartados: array[string]   # ej. ["A", "C"] con qué regla los descartó
    candidatos_restantes: array[string]     # subconjunto de [A,B,C,M,E] que sobrevivió al fast-fail
    tipo_esperado_por_negocio: enum [A, B, C, M, E, null]
    tipo_detectado_por_documento: enum [A, B, C, M, E, null]
    reglas_aplicadas: array[string]     # ids de reglas usadas, ej. ["R3"] o ["R1","R6","DA1"]
    coincide_negocio_vs_documento: boolean
    alerta:
      disparada: boolean
      regla: string | null
      mensaje: string | null
    campos_desconocidos: array[string]  # qué faltó para tener confianza alta

instrucciones_de_salida: |
  Devolvé ÚNICAMENTE el JSON según el schema. No agregues texto explicativo fuera
  del JSON. Si faltan datos críticos (condicion_fiscal de emisor o receptor),
  poné confianza "baja" y listá los campos faltantes en campos_desconocidos.

ejemplos:
  - descripcion: "Conflicto negocio vs documento (caso original)"
    input:
      emisor: {cuit: "30-12345678-9", condicion_fiscal: "Responsable Inscripto", pais: "Argentina"}
      receptor: {cuit: "30-98765432-1", condicion_fiscal: "Responsable Inscripto", pais: "Argentina"}
      padron_arca: {emisor_condicion: "Responsable Inscripto"}
      ocr:
        letra_detectada_cabecera: "B"
        texto_encabezado: "FACTURA B"
        desglose_iva_discriminado: false
        campos_totales: "subtotal_unico"
        conteo_cuits_detectados: 2
        menciona_iva_o_alicuota: false
        receptor_texto_condicion: "no_detectado"
        receptor_pais_texto: "Argentina"
        moneda: "ARS"
        tipo_cambio_declarado: false
        encabezado_tipo_documento: "FACTURA"
        comprobante_asociado_detectado: null
    output:
      tipo_documento: "Factura"
      tipo_comprobante: "A"
      confianza: "media"
      candidatos_descartados: ["C (DC2: emisor es RI)", "E (DE1: receptor en Argentina)"]
      candidatos_restantes: ["A", "B", "M"]
      tipo_esperado_por_negocio: "A"
      tipo_detectado_por_documento: "B"
      reglas_aplicadas: ["DC2", "DE1", "DE2", "R2A", "R4", "R7"]
      coincide_negocio_vs_documento: false
      alerta:
        disparada: true
        regla: "R7"
        mensaje: "Comprobante inválido para cómputo de crédito fiscal. Requiere rechazo de rendición y solicitud de Nota de Crédito + Factura A correcta."
      campos_desconocidos: []

  - descripcion: "Fast-fail deja un único candidato, sin conflicto"
    input:
      emisor: {cuit: "27-11111111-4", condicion_fiscal: "Monotributo", pais: "Argentina"}
      receptor: {cuit: "30-98765432-1", condicion_fiscal: "Responsable Inscripto", pais: "Argentina"}
      padron_arca: {emisor_condicion: "Monotributo"}
      ocr:
        letra_detectada_cabecera: "C"
        texto_encabezado: "FACTURA C"
        desglose_iva_discriminado: false
        campos_totales: "subtotal_unico"
        conteo_cuits_detectados: 1
        menciona_iva_o_alicuota: false
        receptor_texto_condicion: "no_detectado"
        receptor_pais_texto: "Argentina"
        moneda: "ARS"
        tipo_cambio_declarado: false
        encabezado_tipo_documento: "FACTURA"
        comprobante_asociado_detectado: null
    output:
      tipo_documento: "Factura"
      tipo_comprobante: "C"
      confianza: "alta"
      candidatos_descartados: ["A (DA1: <2 CUITs, DA2: sin IVA)", "B (DB2: emisor Monotributo)", "E (DE1, DE2)"]
      candidatos_restantes: ["C", "M"]
      tipo_esperado_por_negocio: "C"
      tipo_detectado_por_documento: "C"
      reglas_aplicadas: ["DA1", "DA2", "DB2", "DE1", "DE2", "R1", "R4"]
      coincide_negocio_vs_documento: true
      alerta: {disparada: false, regla: null, mensaje: null}
      campos_desconocidos: []
