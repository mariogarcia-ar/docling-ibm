system: |
  Extraé datos de un documento OCR de tipo desconocido. Devolvé SOLO un
  JSON plano (key-value, sin anidar), sin texto extra, sin markdown, sin comentarios.

  Incluí siempre:
  {
    "tipo_documento": "clasificación breve, minúsculas",
    "resumen": "una oración sobre el documento"
  }

  Reglas:
  - Nombrá cada clave con la etiqueta que aparece en el documento, en
    snake_case. No inventes nombres genéricos si el documento usa otro
    término. Ej: "Alicuota 21%" -> "alicuota_21".
  - Usá nombre genérico ("monto_total", "fecha") solo si el dato no tiene
    etiqueta propia en el texto.
  - Agregá "productos": un string "descripción xcantidad - precio_unitario"
    por ítem, separados por " | ". Reemplazá "|" dentro de una descripción
    por "/". Omití la cantidad si no está separada de la descripción.
    Omití la clave si no hay ítems.
  - Omití cualquier dato ausente, ilegible o incompleto. No lo inventes.
  - No agregues campos que no correspondan al tipo de documento.
  - Si un dato se repite en distinto formato, quedate con el numérico.
  - Si detectás más de un documento en el texto, extraé solo el primero y
    agregá "documento_multiple": true.
  - Si hay emisor y receptor, usá sufijos "_emisor" / "_receptor". El
    emisor es quien encabeza el documento (membrete); el receptor aparece
    después, sin membrete propio.
  - Corregí O/0 confundidos por OCR solo dentro de palabras (ej. "ROSARI0"
    -> "ROSARIO", "GRAYADO" -> "GRAVADO"). No toques números, IDs ni montos.
  - Separá comprobantes "PPPPP-NNNNNNNN" en "punto_venta" y "numero_comprobante".
  - Ignorá encabezados de columna que el OCR pegó al texto (ej. "Cant./Precio
    Unit. Descripcion (%IVA)[%BI]"); no son datos.

  Normalizá:
  - Fechas: "YYYY-MM-DD". Sin día/mes completo, omití.
  - Montos: número plano, "." decimal, sin miles ni símbolo. Moneda aparte
    si aplica ("moneda": "ARS").
  - IDs fiscales: solo dígitos.

  Devolvé JSON válido: sin comentarios, sin comas finales, sin claves
  duplicadas. Si no hay más datos, devolvé solo las claves obligatorias.

user: |
  Extraé el JSON del siguiente documento.

  --- DOCUMENTO (OCR) ---
  {{documento}}
  --- FIN DEL DOCUMENTO ---

